<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ISD1 Record Management</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14456b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ISD1 Records">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--blue:#14456b;--blue2:#1c5a8a;--bg:#f4f6f8;--panel:#fff;--line:#dbe2e8;--ink:#1c2b36;--muted:#5c6b78;--ok:#1f7a4d;--warn:#b3541c;--danger:#a63a3a;}
*{box-sizing:border-box;} body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:70px;}
h1,h2,h3{margin:0 0 6px;} header{background:var(--blue);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;}
header .t{font-size:1.02rem;font-weight:600;} header small{display:block;font-size:.68rem;opacity:.8;font-weight:400;}
main{max-width:640px;margin:0 auto;padding:12px;}
@media (min-width:820px){ main{max-width:900px;} }
@media (min-width:1200px){ main{max-width:1180px;} }
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
label{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:8px 0 3px;}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-size:.9rem;font-family:inherit;background:#fff;}
textarea{min-height:64px;}
button{font-family:inherit;font-weight:600;font-size:.85rem;border-radius:6px;border:1px solid transparent;padding:9px 13px;cursor:pointer;}
.btn-p{background:var(--blue);color:#fff;} .btn-o{background:#fff;border-color:var(--line);color:var(--ink);}
.btn-d{background:#fff;border-color:var(--danger);color:var(--danger);} .btn-block{width:100%;margin-top:10px;}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.86rem;}
.stackrow{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:.86rem;gap:6px;}
.stackrow-head{display:flex;gap:8px;align-items:flex-start;}
.stackrow-actions{display:flex;gap:6px;flex-wrap:wrap;}
@media (min-width:820px){
  .stackrow{flex-direction:row;align-items:center;flex-wrap:wrap;gap:12px;padding:10px 4px;}
  .stackrow-head{flex:1;min-width:0;}
  .stackrow-actions{flex:none;}
  .stackrow .editBox{flex-basis:100%;}
}
.row:last-child{border-bottom:none;} .meta{font-size:.72rem;color:var(--muted);}
.tag{font-size:.62rem;text-transform:uppercase;font-weight:700;padding:2px 7px;border-radius:100px;}
.tag.g{background:#e5f1ea;color:var(--ok);} .tag.o{background:#fbeee2;color:var(--warn);} .tag.r{background:#f7e3e3;color:var(--danger);}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:20;overflow-x:auto;}
nav button{flex:1;min-width:78px;background:none;border:none;border-radius:0;padding:12px 4px;color:var(--muted);font-size:.78rem;font-weight:600;}
nav button.active{color:var(--blue);font-weight:700;border-top:3px solid var(--blue);}
body{padding-bottom:88px;}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;} .pill{font-size:.72rem;padding:5px 10px;border-radius:100px;border:1px solid var(--line);background:#fff;cursor:pointer;}
.pill.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.empty{text-align:center;padding:22px;color:var(--muted);font-size:.84rem;border:1px dashed var(--line);border-radius:8px;}
.banner{padding:9px 12px;border-radius:6px;font-size:.8rem;margin-bottom:10px;}
.banner.err{background:#f7e3e3;color:var(--danger);} .banner.info{background:#e6eef4;color:var(--blue);}
.stat{display:inline-block;min-width:88px;text-align:center;padding:10px 8px;background:#f0f4f7;border-radius:8px;margin:4px;}
.stat b{display:block;font-size:1.3rem;} .stat span{font-size:.66rem;color:var(--muted);text-transform:uppercase;}
table{width:100%;border-collapse:collapse;font-size:.8rem;} td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;}
.switchrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #eee;font-size:.82rem;}
.hidden{display:none!important;}
@keyframes spin{to{transform:rotate(360deg);}}
.center{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;}
video,canvas{width:100%;border-radius:6px;background:#000;}
</style></head>
<body>
<header><div><div class="t">ISD1 Record Management</div><small id="hdrSub">Not signed in</small></div>
<button class="btn-o" id="signoutBtn" style="display:none;">Sign out</button></header>
<main id="main"></main>
<nav id="nav" class="hidden"></nav>

<script>
/* ============ CONFIG ============ */
const LS = { get:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}}, set:(k,v)=>localStorage.setItem(k,JSON.stringify(v)) };
const APP = { apiUrl: LS.get('rms_api_url',''), token: LS.get('rms_token',''), user: LS.get('rms_user',null), screen:'dashboard', cache:{}, _renderToken:0 };

async function api(action, payload={}){
  if (!APP.apiUrl) throw new Error('API URL not configured');
  const res = await fetch(APP.apiUrl, {method:'POST', body: JSON.stringify(Object.assign({action, token:APP.token}, payload))});
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild;}
function attachPasswordToggle(inputEl){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:relative;';
  inputEl.parentNode.insertBefore(wrap, inputEl);
  wrap.appendChild(inputEl);
  inputEl.style.paddingRight = '46px';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = 'Show';
  btn.style.cssText = 'position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;color:#14456b;font-size:.72rem;font-weight:700;padding:6px 8px;cursor:pointer;';
  btn.onclick = ()=>{
    const showing = inputEl.type==='text';
    inputEl.type = showing ? 'password' : 'text';
    btn.textContent = showing ? 'Show' : 'Hide';
  };
  wrap.appendChild(btn);
}
function esc(s){return (s||'').toString().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* ============ RENDER ROOT ============ */
function render(){
  const main = document.getElementById('main');
  const nav = document.getElementById('nav');
  const hdrSub = document.getElementById('hdrSub');
  const signoutBtn = document.getElementById('signoutBtn');

  if (!APP.apiUrl){ nav.classList.add('hidden'); signoutBtn.style.display='none'; hdrSub.textContent='Setup required'; main.innerHTML=''; main.appendChild(screenApiSetup()); return; }
  if (!APP.token || !APP.user){ nav.classList.add('hidden'); signoutBtn.style.display='none'; hdrSub.textContent='Not signed in'; main.innerHTML=''; main.appendChild(screenLogin()); return; }

  hdrSub.textContent = APP.user.name+' · '+roleLabel(APP.user.role);
  signoutBtn.style.display='inline-block';
  signoutBtn.onclick = doSignOut;
  nav.classList.remove('hidden');
  renderNav();
  const renderToken = ++APP._renderToken;
  main.innerHTML = '';
  main.appendChild(loadingSpinner());
  const screens = {
    dashboard: screenDashboard, inward: ()=>screenRegister('inward'), outward: ()=>screenRegister('outward'),
    mywork: screenMyWork, attendance: screenAttendance, users: screenUsers, storage: screenStorage, audit: screenAudit,
    abstract: screenAbstract
  };
  (screens[APP.screen]||screenDashboard)().then(node=>{
    if (renderToken !== APP._renderToken) return; // a newer screen was requested meanwhile, discard this one
    main.innerHTML='';
    main.appendChild(node);
  });
}
function loadingSpinner(){
  return el(`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--muted);">
    <div style="width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;"></div>
    <div style="margin-top:12px;font-size:.85rem;">Loading…</div>
  </div>`);
}
function roleLabel(r){return r==='admin'?'Administrator':r==='field_officer'?'Field Officer':r==='work_inspector'?'Work Inspector':r;}

function renderNav(){
  const nav = document.getElementById('nav'); nav.innerHTML='';
  const perms = APP.user.permissions||{};
  const isAdmin = APP.user.role==='admin';
  let items = [['dashboard','Home']];
  if (isAdmin||perms.inward_view) items.push(['inward','Inward']);
  if (isAdmin||perms.outward_view) items.push(['outward','Outward']);
  items.push(['mywork','My Work']);
  if (isAdmin||perms.inward_view||perms.outward_view||perms.reports_view) items.push(['abstract','Abstract']);
  if (isAdmin||perms.attendance_view) items.push(['attendance','Attendance']);
  if (isAdmin||perms.storage_view) items.push(['storage','Storage']);
  if (isAdmin) items.push(['users','Users']);
  if (isAdmin) items.push(['audit','Audit']);
  items.forEach(([id,label])=>{
    const b = el(`<button class="${APP.screen===id?'active':''}">${label}</button>`);
    b.onclick = ()=>{APP.screen=id; render();};
    nav.appendChild(b);
  });
}

/* ============ SCREENS: setup / auth ============ */
function screenApiSetup(){
  const w = el(`<div class="card">
    <h2>Connect the backend</h2>
    <p class="meta">Paste the Apps Script Web App URL (from Deploy → New deployment → Web app).</p>
    <label>Web App URL</label><input id="apiUrlInput" placeholder="https://script.google.com/macros/s/XXXX/exec">
    <button class="btn-p btn-block" id="saveApi">Save</button>
  </div>`);
  w.querySelector('#saveApi').onclick=()=>{
    const v = w.querySelector('#apiUrlInput').value.trim();
    if (!v){alert('Enter the URL');return;}
    APP.apiUrl=v; LS.set('rms_api_url',v); render();
  };
  return w;
}

function screenLogin(){
  const w = el(`<div class="center">
    <h1 style="font-size:1.3rem;">ISD1 Record Management</h1>
    <p class="meta" style="max-width:300px;margin:6px 0 16px;">Sign in with your office username and password.</p>
    <div class="card" style="width:100%;max-width:320px;text-align:left;">
      <div id="loginErr"></div>
      <label>Username</label><input id="loginUser">
      <label>Password</label><input id="loginPass" type="password">
      <button class="btn-p btn-block" id="loginBtn">Sign in</button>
      <button class="btn-o btn-block" id="firstAdminBtn">First time setup — create administrator</button>
    </div>
  </div>`);
  w.querySelector('#loginBtn').onclick = async ()=>{
    const errBox = w.querySelector('#loginErr'); errBox.innerHTML='';
    const username = w.querySelector('#loginUser').value.trim();
    const password = w.querySelector('#loginPass').value;
    try{
      const data = await api('login', {username, password});
      APP.token=data.token; APP.user=data.user;
      LS.set('rms_token', APP.token); LS.set('rms_user', APP.user);
      APP.screen='dashboard'; render();
    }catch(e){ errBox.innerHTML = `<div class="banner err">${esc(e.message)}</div>`; }
  };
  w.querySelector('#firstAdminBtn').onclick = ()=>{ APP.screen='bootstrap'; renderBootstrap(); };
  attachPasswordToggle(w.querySelector('#loginPass'));
  return w;
}

function renderBootstrap(){
  const main = document.getElementById('main'); main.innerHTML='';
  const w = el(`<div class="center">
    <h2>Create the first administrator</h2>
    <p class="meta" style="max-width:300px;">Only works once — before any user accounts exist.</p>
    <div class="card" style="width:100%;max-width:320px;text-align:left;">
      <div id="bErr"></div>
      <label>Full name</label><input id="bName">
      <label>Username</label><input id="bUser">
      <label>Password (min 8 chars)</label><input id="bPass" type="password">
      <button class="btn-p btn-block" id="bGo">Create administrator</button>
      <button class="btn-o btn-block" id="bBack">Back to sign in</button>
    </div>
  </div>`);
  w.querySelector('#bBack').onclick=()=>{APP.screen='dashboard'; render();};
  w.querySelector('#bGo').onclick = async ()=>{
    const errBox = w.querySelector('#bErr'); errBox.innerHTML='';
    try{
      await api('bootstrap_admin', {name:w.querySelector('#bName').value, username:w.querySelector('#bUser').value, password:w.querySelector('#bPass').value});
      errBox.innerHTML = `<div class="banner info">Administrator created. Sign in now.</div>`;
      setTimeout(()=>{APP.screen='dashboard'; render();}, 1200);
    }catch(e){ errBox.innerHTML = `<div class="banner err">${esc(e.message)}</div>`; }
  };
  attachPasswordToggle(w.querySelector('#bPass'));
  main.appendChild(w);
}
function doSignOut(){ api('logout').catch(()=>{}); APP.token=null; APP.user=null; LS.set('rms_token',''); LS.set('rms_user',null); render(); }

/* ============ SCREENS: dashboard ============ */
async function screenDashboard(){
  const w = document.createElement('div');
  if (APP.user.role==='admin'){
    try{
      const s = await api('dashboard_stats');
      const pendingCount = s.pendingCount;
      w.appendChild(el(`<div class="card"><h2>Overview</h2>
        <div class="stat"><b>${s.inwardTotal}</b><span>Inward</span></div>
        <div class="stat"><b>${s.outwardTotal}</b><span>Outward</span></div>
        <div class="stat"><b>${s.employeesTotal}</b><span>Employees</span></div>
        <div class="stat"><b>${s.activeEmployees}</b><span>Active</span></div>
        <div class="stat"><b>${s.attendanceToday.present}</b><span>Present today</span></div>
        <div class="stat"><b>${s.attendanceToday.absent}</b><span>Absent today</span></div>
      </div>`));
      const pendingCard = el(`<div class="card">
        <h2>Pending Inward</h2>
        <div class="stat" style="background:#fbeee2;"><b>${pendingCount}</b><span>Pending</span></div>
        <div style="margin-top:8px;"><a href="#" id="viewAllPending">View all pending →</a></div>
      </div>`);
      pendingCard.querySelector('#viewAllPending').onclick = (e)=>{ e.preventDefault(); APP.pendingOnly = true; APP.screen='inward'; render(); };
      w.appendChild(pendingCard);
      const statusRows = Object.entries(s.inwardByStatus||{}).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${v}</b></div>`).join('') || '<div class="empty">No inward yet</div>';
      w.appendChild(el(`<div class="card"><h2>Inward by status</h2>${statusRows}</div>`));
    }catch(e){ w.appendChild(el(`<div class="banner err">${esc(e.message)}</div>`)); }
  } else {
    w.appendChild(el(`<div class="card"><h2>Welcome, ${esc(APP.user.name)}</h2><p class="meta">${roleLabel(APP.user.role)}</p></div>`));
  }
  return w;
}

/* ============ SCREENS: inward / outward ============ */
async function screenRegister(kind){
  const w = document.createElement('div');
  const perms = APP.user.permissions||{}; const isAdmin = APP.user.role==='admin';
  const canCreate = isAdmin || perms[kind+'_create'];
  const canDelete = isAdmin;
  const numberLabel = kind==='inward' ? 'Inward Number' : 'Outward Number';

  // Fetch the full list ONCE — reused for the form's duplicate check, the outward-link dropdown,
  // bulk-import duplicate detection, and the row list itself.
  let list = [];
  let listLoadError = '';
  try{ list = kind==='inward' ? (await api('list_inward')).inward : (await api('list_outward')).outward; }
  catch(e){ listLoadError = e.message; }
  // Sort by number: Inward descending (newest/highest number first), Outward ascending.
  function refNoCompare(a, b){
    const na = parseFloat(a.refNo), nb = parseFloat(b.refNo);
    const bothNumeric = !isNaN(na) && !isNaN(nb);
    return bothNumeric ? (na-nb) : String(a.refNo||'').localeCompare(String(b.refNo||''));
  }
  list = list.slice().sort(refNoCompare);
  if (kind==='inward') list.reverse();
  let inwardList = list;
  if (kind==='outward'){ try{ inwardList = (await api('list_inward')).inward; }catch(e){} }

  // Consume the "pending only" flag set from the dashboard's "View all pending" link (inward only)
  const applyPendingFilter = (kind==='inward' && APP.pendingOnly);
  APP.pendingOnly = false;

  // Consume a prefill request to open the Outward form pre-linked to a specific Inward entry
  const outwardPrefill = (kind==='outward') ? APP.prefillOutwardFor : null;
  APP.prefillOutwardFor = null;

  let folderOptions = [];
  let folderLoadError = '';
  try{ folderOptions = (await api('list_folder_tree')).folders; }catch(e){ folderLoadError = e.message; }
  if (!folderOptions.length) folderOptions = [{id:'', name:'Attachments (default)', path:'Attachments (default)'}];

  if (canCreate){
    const form = el(`<div class="card"><h2>New ${kind} entry</h2>
      ${folderLoadError ? `<div class="banner err">Folder list error: ${esc(folderLoadError)}</div>` : ''}
      <label>Date</label><input type="date" id="f_date" value="${new Date().toISOString().slice(0,10)}">
      <label>${kind==='inward'?'From':'To'}</label><input id="f_party">
      <label>${numberLabel}</label><input id="f_ref">
      <label>Subject</label><textarea id="f_subject"></textarea>
      <label>Remarks</label><textarea id="f_remarks"></textarea>
      ${kind==='outward' ? `<label>Link to Inward (optional)</label><select id="f_link"><option value="">— none —</option>${inwardList.map(i=>`<option value="${i.id}" ${outwardPrefill&&outwardPrefill.id===i.id?'selected':''}>${esc(i.refNo)} — ${esc(i.subject).slice(0,40)}</option>`).join('')}</select>`:''}
      <label>Target storage folder</label>
      <select id="f_folder">${folderOptions.map(fo=>`<option value="${fo.id}">${esc(fo.path)}</option>`).join('')}</select>
      <label>Attach document (camera or file)</label>
      <input type="file" id="f_file" accept="image/*,application/pdf" capture="environment">
      <button class="btn-o btn-block" type="button" id="f_scanBtn" style="margin-top:8px;">📷 Scan multiple pages → one PDF</button>
      <div id="f_preview"></div>
      <button class="btn-p btn-block" id="f_save">Save entry</button>
      <div id="f_err"></div>
    </div>`);
    if (outwardPrefill){
      form.insertBefore(el(`<div class="banner info">Linked to Inward ${esc(outwardPrefill.refNo)} — "${esc(outwardPrefill.subject).slice(0,60)}"</div>`), form.firstChild.nextSibling);
    }
    let rotation = 0, fileDataUrl=null, fileMime=null, fileName=null, scannedPageCount=0;
    form.querySelector('#f_file').onchange = (e)=>{
      const file = e.target.files[0]; if (!file) return;
      fileName=file.name; fileMime=file.type; scannedPageCount=0;
      const reader = new FileReader();
      reader.onload = ()=>{ fileDataUrl = reader.result; rotation=0; renderPreview(); };
      reader.readAsDataURL(file);
    };
    form.querySelector('#f_scanBtn').onclick = ()=>{
      openMultiPageScanner((result)=>{
        fileDataUrl = result.dataUrl; fileMime = result.mime; fileName = result.fileName;
        rotation = 0; scannedPageCount = result.pageCount;
        renderPreview();
      });
    };
    function renderPreview(){
      const pv = form.querySelector('#f_preview'); pv.innerHTML='';
      if (!fileDataUrl) return;
      if (fileMime==='application/pdf'){
        pv.appendChild(el(`<div class="banner info" style="margin-top:8px;">📄 ${esc(fileName)}${scannedPageCount?` — ${scannedPageCount} page${scannedPageCount>1?'s':''} scanned`:''}, ready to attach.</div>`));
        return;
      }
      if (!fileMime.startsWith('image/')) return;
      const canvas = document.createElement('canvas'); canvas.style.marginTop='8px';
      const img = new Image();
      img.onload = ()=>{
        const rad = rotation*Math.PI/180;
        const swap = rotation%180!==0;
        canvas.width = swap? img.height: img.width; canvas.height = swap? img.width: img.height;
        const ctx = canvas.getContext('2d');
        ctx.translate(canvas.width/2, canvas.height/2); ctx.rotate(rad);
        ctx.drawImage(img, -img.width/2, -img.height/2);
      };
      img.src = fileDataUrl;
      pv.appendChild(canvas);
      const rotBtn = el(`<button class="btn-o btn-block" type="button">Rotate 90°</button>`);
      rotBtn.onclick = ()=>{ rotation=(rotation+90)%360; renderPreview(); };
      pv.appendChild(rotBtn);
    }
    form.querySelector('#f_save').onclick = async ()=>{
      const btn = form.querySelector('#f_save'); btn.disabled=true; btn.textContent='Saving…';
      const errBox = form.querySelector('#f_err'); errBox.innerHTML='';
      try{
        const refNoVal = form.querySelector('#f_ref').value.trim();
        const existing = list.find(x=>String(x.refNo)===String(refNoVal));
        let replaceDuplicates = false;
        if (existing){
          const ok = confirm(`An ${kind} entry with ${numberLabel} "${refNoVal}" already exists (Subject: "${existing.subject}"). Do you want to replace the existing entry with this new data?`);
          if (!ok){ errBox.innerHTML = `<div class="banner info">Not saved — ${numberLabel} "${refNoVal}" already exists.</div>`; btn.disabled=false; btn.textContent='Save entry'; return; }
          replaceDuplicates = true;
        }
        let attachment = null;
        const chosenFolder = form.querySelector('#f_folder').value;
        if (fileDataUrl){
          let base64 = fileDataUrl.split(',')[1];
          if (fileMime.startsWith('image/') && rotation!==0){
            base64 = await new Promise(resolve=>{
              const canvas = form.querySelector('#f_preview canvas');
              resolve(canvas.toDataURL(fileMime).split(',')[1]);
            });
          }
          const up = await api('upload_file', {fileName, mimeType:fileMime, base64Data:base64, folderId: chosenFolder});
          attachment = {id:up.id, name:up.name, url:up.url};
        }
        const row = { date: form.querySelector('#f_date').value, refNo: refNoVal,
          subject: form.querySelector('#f_subject').value, remarks: form.querySelector('#f_remarks').value };
        if (kind==='inward'){
          row.from = form.querySelector('#f_party').value;
          const result = await api('bulk_upsert_inward', {rows:[row], replaceDuplicates});
          if (attachment && result && (result.created || result.updated)){
            const target = list.find(x=>String(x.refNo)===String(refNoVal));
            // attachment on brand-new/replaced row: attach via update since bulk_upsert doesn't take file data directly
            const fresh = (await api('list_inward')).inward;
            const rec = fresh.find(x=>String(x.refNo)===String(refNoVal));

    w.appendChild(distCard);
  }
  return w;
}

/* ============ BULK EXCEL IMPORT (Inward / Outward) ============ */
function screenBulkImport(kind, numberLabel, existingList, inwardListForLink){
  const isInward = kind==='inward';
  const card = el(`<div class="card"><h2>Bulk ${isInward?'Inward':'Outward'} entry (Excel)</h2>
    <p class="meta">Download the template, fill multiple rows offline, then upload it back — all rows get created in one go.</p>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">
      <button class="btn-o btn-sm" id="bulkTemplateBtn" type="button">⬇ Download Excel template</button>
    </div>
    <label style="margin-top:10px;">Upload filled template</label>
    <input type="file" id="bulkFile" accept=".xlsx,.xls">
    <div id="bulkStatus" style="margin-top:8px;"></div>
  </div>`);

  card.querySelector('#bulkTemplateBtn').onclick = ()=>{
    const headers = isInward
      ? ['Date (YYYY-MM-DD)', numberLabel, 'Letter No.', 'From', 'Subject', 'Remarks']
      : ['Date (YYYY-MM-DD)', numberLabel, 'Letter No.', 'To', 'Subject', 'Remarks', 'Linked Inward Number (optional)'];
    const sample = isInward
      ? ['2026-08-20', '101', 'LR-45', 'EE ID1 Siddipet', 'Sample subject line', 'Sample remarks']
      : ['2026-08-20', '55', 'LR-12', 'CE Office', 'Sample subject line', 'Sample remarks', '101'];
    const ws = XLSX.utils.aoa_to_sheet([headers, sample]);
    // Force the Date column (col A) to be stored as text, so Excel/Sheets never
    // silently reformats it into a locale date format when the file is opened.
    ['A1','A2'].forEach(addr=>{ if (ws[addr]) ws[addr].t = 's'; });
    ws['!cols'] = [{wch:16},{wch:14},{wch:12},{wch:20},{wch:34},{wch:24},{wch:22}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, isInward?'Inward':'Outward');
    XLSX.writeFile(wb, `${kind}-bulk-template.xlsx`);
  };

  card.querySelector('#bulkFile').onchange = (e)=>{
    const file = e.target.files[0]; if (!file) return;
    const statusEl = card.querySelector('#bulkStatus');
    statusEl.innerHTML = `<div class="banner info">Reading file…</div>`;
    const reader = new FileReader();
    reader.onload = async (ev)=>{
      try{
        const wb = XLSX.read(ev.target.result, {type:'array', cellDates:true});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
        if (!rows.length){ statusEl.innerHTML = `<div class="banner err">No data rows found in the sheet.</div>`; return; }
        function formatDate(v){
          if (v instanceof Date) return v.toISOString().slice(0,10);
          return String(v).trim();
        }
        const mapped = rows.map(r=>{
          const get = (keyPart)=>{
            const key = Object.keys(r).find(k=>k.toLowerCase().includes(keyPart));
            return key ? r[key] : '';
          };
          const letterNo = String(get('letter')||'').trim();
          const rawSubject = String(get('subject')||'').trim();
          const subject = letterNo ? `${letterNo} - ${rawSubject}` : rawSubject;
          const base = {
            date: formatDate(get('date')), refNo: String(get(numberLabel.toLowerCase().slice(0,6)) || get('number')||'').trim(),
            subject, remarks: String(get('remarks')||'').trim()
          };
          if (isInward) base.from = String(get('from')||'').trim();
          else { base.to = String(get('to')||'').trim(); base.linkedInwardNumber = String(get('linked')||'').trim(); }
          return base;
        });

        // Duplicate detection against existing entries, keyed by Inward/Outward Number
        const existingRefNos = new Set(existingList.map(x=>String(x.refNo)));
        const duplicateRefNos = [...new Set(mapped.filter(r=>existingRefNos.has(String(r.refNo))).map(r=>r.refNo))];
        let replaceDuplicates = false;
        if (duplicateRefNos.length){
          replaceDuplicates = confirm(
            `The following ${numberLabel}(s) already exist and will be REPLACED if you continue:\n\n${duplicateRefNos.join(', ')}\n\n` +
            `Click OK to replace the existing data for these entries.\nClick Cancel to skip them and only add the new (non-duplicate) rows.`
          );
        }

        statusEl.innerHTML = `<div class="banner info">Uploading ${mapped.length} row(s)…</div>`;
        const result = await api(isInward?'bulk_upsert_inward':'bulk_upsert_outward', {rows: mapped, replaceDuplicates});
        let msg = `<div class="banner info">✓ ${result.created} created${result.updated?`, ${result.updated} replaced`:''}.</div>`;
        if (result.skipped && result.skipped.length){
          msg += `<div class="banner err">${result.skipped.length} row(s) had issues:<br>${result.skipped.map(s=>esc(s)).join('<br>')}</div>`;
        }
        statusEl.innerHTML = msg;
        card.querySelector('#bulkFile').value = '';
        setTimeout(()=>{ APP.screen=kind; render(); }, 1800);
      }catch(err){
        statusEl.innerHTML = `<div class="banner err">${esc(err.message)}</div>`;
      }
    };
    reader.readAsArrayBuffer(file);
  };
  return card;
}

/* ============ MULTI-PAGE CAMERA SCANNER → SINGLE PDF ============ */
function openMultiPageScanner(onComplete){
  const pages = []; // array of {dataUrl, w, h} - final, edited
  let stream = null;

  const overlay = el(`<div style="position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;">
    <video id="scanVideo" autoplay playsinline style="flex:1;width:100%;object-fit:cover;background:#111;"></video>
    <div style="text-align:center;color:#9c9;font-size:.7rem;padding:2px;" id="focusHint">Tap the preview to focus</div>
    <div style="background:#111;padding:10px;text-align:center;color:#fff;font-size:.85rem;" id="scanCount">0 pages captured</div>
    <div style="background:#111;padding:10px;display:flex;gap:8px;">
      <button class="btn-o btn-block" id="scanCancel" type="button">✕ Cancel</button>
      <button class="btn-p btn-block" id="scanCapture" type="button" style="flex:2;">📸 Capture page</button>
      <button class="btn-brass btn-block" id="scanDone" type="button" disabled>✅ Done</button>
    </div>
  </div>`);
  document.body.appendChild(overlay);
  const video = overlay.querySelector('#scanVideo');
  const countLabel = overlay.querySelector('#scanCount');
  const doneBtn = overlay.querySelector('#scanDone');
  let track = null;

  function cleanup(){
    if (stream) stream.getTracks().forEach(t=>t.stop());
    if (overlay.parentNode) document.body.removeChild(overlay);
  }

  async function startCamera(){
    const highRes = { video: {
      facingMode: 'environment',
      width: { ideal: 2560 }, height: { ideal: 1440 },
      advanced: [{ focusMode: 'continuous' }]
    }};
    try{
      stream = await navigator.mediaDevices.getUserMedia(highRes);
    }catch(err){
      // Device rejected the high-res/focus constraints — fall back to a basic request.
      try{ stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); }
      catch(err2){ alert('Could not access camera: '+err2.message); cleanup(); return; }
    }
    video.srcObject = stream;
    track = stream.getVideoTracks()[0];
    // Best-effort: explicitly request continuous autofocus if the device exposes that capability.
    try{
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.focusMode && caps.focusMode.includes('continuous')){
        await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
      }
    }catch(e){}
  }
  startCamera();

  // Tap-to-focus: on supported devices (mainly Android Chrome), nudge focus to the tapped point.
  video.addEventListener('click', async (e)=>{
    if (!track || !track.getCapabilities) return;
    try{
      const caps = track.getCapabilities();
      if (!caps.focusMode) return;
      const rect = video.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      const constraints = { advanced: [{ focusMode: 'single-shot', pointsOfInterest: [{x, y}] }] };
      await track.applyConstraints(constraints);
      const hint = overlay.querySelector('#focusHint');
      hint.textContent = 'Focusing…';
      setTimeout(()=>{ hint.textContent = 'Tap the preview to focus'; }, 700);
    }catch(err){ /* not supported on this device — silently ignore */ }
  });

  overlay.querySelector('#scanCancel').onclick = cleanup;

  overlay.querySelector('#scanCapture').onclick = ()=>{
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    overlay.style.background = '#fff';
    setTimeout(()=>{ overlay.style.background = '#000'; }, 90);
    openPageEditor(canvas, (finalCanvas)=>{
      pages.push({ dataUrl: finalCanvas.toDataURL('image/jpeg', 0.95), w: finalCanvas.width, h: finalCanvas.height });
      countLabel.textContent = `${pages.length} page${pages.length>1?'s':''} captured`;
      doneBtn.disabled = pages.length===0;
    });
  };

  doneBtn.onclick = ()=>{
    if (!pages.length) return;
    doneBtn.disabled = true; doneBtn.textContent = 'Building PDF…';
    try{
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit:'mm', format:'a4' });
      pages.forEach((page, i)=>{
        if (i>0) doc.addPage();
        const pageW = doc.internal.pageSize.getWidth();
        const pageH = doc.internal.pageSize.getHeight();
        const margin = 5;
        const maxW = pageW - margin*2, maxH = pageH - margin*2;
        const scale = Math.min(maxW/page.w, maxH/page.h);
        const w = page.w*scale, h = page.h*scale;
        const x = (pageW-w)/2, y = (pageH-h)/2;
        doc.addImage(page.dataUrl, 'JPEG', x, y, w, h, undefined, 'FAST');
      });
      const blob = doc.output('blob');
      const reader = new FileReader();
      reader.onload = ()=>{
        cleanup();
        onComplete({ dataUrl: reader.result, mime:'application/pdf', fileName:`scan-${Date.now()}.pdf`, pageCount: pages.length });
      };
      reader.readAsDataURL(blob);
    }catch(e){
      alert('Could not build PDF: '+e.message);
      cleanup();
    }
  };
}

function openPageEditor(sourceCanvas, onDone){
  let rotation = 0;       // 0/90/180/270, applied to sourceCanvas
  let colorMode = 'original'; // original | grayscale | bw | enhance
  let cropRect = null;    // {x,y,w,h} in rotated-canvas pixel space; null = full image

  const ed = el(`<div style="position:fixed;inset:0;background:#000;z-index:110;display:flex;flex-direction:column;">

      <div id="edStage" style="position:relative;max-width:100%;max-height:100%;">
        <img id="edImg" style="display:block;max-width:100%;max-height:70vh;touch-action:none;">
        <div id="edSelBox" style="position:absolute;border:2px solid #ffcc00;background:rgba(255,204,0,0.15);display:none;"></div>
      </div>
    </div>
    <div style="background:#111;padding:8px 10px;">
      <div class="pill-row" style="justify-content:center;">
        <button class="pill" data-mode="original" style="color:#fff;">Original</button>
        <button class="pill" data-mode="grayscale" style="color:#fff;">Grayscale</button>
        <button class="pill" data-mode="bw" style="color:#fff;">B&amp;W Document</button>
        <button class="pill" data-mode="enhance" style="color:#fff;">Enhance</button>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn-o btn-block" id="edRotate" type="button">↻ Rotate 90°</button>
        <button class="btn-o btn-block" id="edResetCrop" type="button">Reset crop</button>
      </div>
      <p style="color:#aaa;font-size:.72rem;text-align:center;margin:8px 0 4px;">Drag on the image to select a crop area (optional)</p>
      <div style="display:flex;gap:8px;">
        <button class="btn-d btn-block" id="edRetake" type="button">Retake</button>
        <button class="btn-p btn-block" id="edAdd" type="button" style="flex:2;">✓ Add page</button>
      </div>
    </div>
  </div>`);
  document.body.appendChild(ed);

  const imgEl = ed.querySelector('#edImg');
  const selBox = ed.querySelector('#edSelBox');
  const stage = ed.querySelector('#edStage');

  let rotatedCanvas = sourceCanvas;
  function refreshRotated(){
    if (rotation===0){ rotatedCanvas = sourceCanvas; return; }
    const swap = rotation%180!==0;
    const c = document.createElement('canvas');
    c.width = swap? sourceCanvas.height: sourceCanvas.width;
    c.height = swap? sourceCanvas.width: sourceCanvas.height;
    const ctx = c.getContext('2d');
    ctx.translate(c.width/2, c.height/2);
    ctx.rotate(rotation*Math.PI/180);
    ctx.drawImage(sourceCanvas, -sourceCanvas.width/2, -sourceCanvas.height/2);
    rotatedCanvas = c;
  }
  function renderPreviewImg(){
    refreshRotated();
    cropRect = null; selBox.style.display='none';
    imgEl.src = rotatedCanvas.toDataURL('image/jpeg', 0.85);
  }
  renderPreviewImg();

  ed.querySelector('#edRotate').onclick = ()=>{ rotation = (rotation+90)%360; renderPreviewImg(); };
  ed.querySelector('#edResetCrop').onclick = ()=>{ cropRect=null; selBox.style.display='none'; };

  ed.querySelectorAll('.pill[data-mode]').forEach(btn=>{
    btn.onclick = ()=>{
      ed.querySelectorAll('.pill[data-mode]').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      colorMode = btn.dataset.mode;
    };
  });
  ed.querySelector('[data-mode="original"]').classList.add('active');

  // Drag-to-select crop rectangle (pointer events, works for touch + mouse)
  let dragStart = null;
  function pointFromEvent(e){
    const rect = imgEl.getBoundingClientRect();
    const cx = (e.touches? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches? e.touches[0].clientY : e.clientY) - rect.top;
    return { x: Math.max(0,Math.min(cx,rect.width)), y: Math.max(0,Math.min(cy,rect.height)), rect };
  }
  function startDrag(e){
    e.preventDefault();
    const p = pointFromEvent(e);
    dragStart = p;
    selBox.style.display = 'block';
    selBox.style.left = p.x+'px'; selBox.style.top = p.y+'px'; selBox.style.width='0px'; selBox.style.height='0px';
  }
  function moveDrag(e){
    if (!dragStart) return;
    e.preventDefault();
    const p = pointFromEvent(e);
    const x = Math.min(dragStart.x, p.x), y = Math.min(dragStart.y, p.y);
    const w = Math.abs(p.x-dragStart.x), h = Math.abs(p.y-dragStart.y);
    selBox.style.left=x+'px'; selBox.style.top=y+'px'; selBox.style.width=w+'px'; selBox.style.height=h+'px';
  }
  function endDrag(e){
    if (!dragStart) return;
    const p = pointFromEvent(e);
    const rect = p.rect;
    const scaleX = rotatedCanvas.width / rect.width, scaleY = rotatedCanvas.height / rect.height;
    const x0 = Math.min(dragStart.x, p.x), y0 = Math.min(dragStart.y, p.y);
    const w0 = Math.abs(p.x-dragStart.x), h0 = Math.abs(p.y-dragStart.y);
    dragStart = null;
    if (w0<10 || h0<10){ selBox.style.display='none'; cropRect=null; return; } // too small = ignore, keep full image
    cropRect = { x: x0*scaleX, y: y0*scaleY, w: w0*scaleX, h: h0*scaleY };
  }
  imgEl.addEventListener('mousedown', startDrag);
  imgEl.addEventListener('mousemove', moveDrag);
  window.addEventListener('mouseup', endDrag);
  imgEl.addEventListener('touchstart', startDrag, {passive:false});
  imgEl.addEventListener('touchmove', moveDrag, {passive:false});
  imgEl.addEventListener('touchend', endDrag);

  function applyColorFilter(canvas, mode){
    if (mode==='original') return canvas;
    const ctx = canvas.getContext('2d');
    const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
    const d = imgData.data;
    if (mode==='grayscale'){
      for (let i=0;i<d.length;i+=4){
        const lum = 0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
        d[i]=d[i+1]=d[i+2]=lum;
      }
    } else if (mode==='bw'){
      // Sample luminance to pick an adaptive threshold (Otsu-lite: use the midpoint
      // between the 10th and 90th percentile) so it works across lighting conditions.
      const sampleStep = 16;
      const lums = [];
      for (let i=0;i<d.length;i+=4*sampleStep){
        lums.push(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]);
      }
      lums.sort((a,b)=>a-b);
      const lo = lums[Math.floor(lums.length*0.1)] || 60;
      const hi = lums[Math.floor(lums.length*0.9)] || 200;
      const threshold = (lo+hi)/2;
      for (let i=0;i<d.length;i+=4){
        const lum = 0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
        const v = lum > threshold ? 255 : 0;
        d[i]=d[i+1]=d[i+2]=v;
      }
    } else if (mode==='enhance'){
      // Real auto-contrast ("magic color"): stretch each channel's actual range
      // (with 1% clipping to ignore outlier noise pixels) to fill 0-255, then
      // apply a mild extra contrast boost. Adapts to each photo's own lighting
      // instead of using one fixed brightness/contrast value for every shot.
      const channels = [0,1,2];
      const mins = [255,255,255], maxs = [0,0,0];
      const histSize = 256;
      const hist = [new Array(histSize).fill(0), new Array(histSize).fill(0), new Array(histSize).fill(0)];
      for (let i=0;i<d.length;i+=4){
        for (const c of channels) hist[c][d[i+c]|0]++;
      }
      const totalPixels = d.length/4;
      const clip = totalPixels*0.01;
      for (const c of channels){
        let count=0;
        for (let v=0; v<histSize; v++){ count+=hist[c][v]; if (count>clip){ mins[c]=v; break; } }
        count=0;
        for (let v=histSize-1; v>=0; v--){ count+=hist[c][v]; if (count>clip){ maxs[c]=v; break; } }
        if (maxs[c]<=mins[c]){ mins[c]=0; maxs[c]=255; }
      }
      const extraContrast = 1.12, extraBrightness = 6;
      for (let i=0;i<d.length;i+=4){
        for (const c of channels){
          let v = (d[i+c]-mins[c]) * (255/(maxs[c]-mins[c]));
          v = (v-128)*extraContrast + 128 + extraBrightness;
          d[i+c] = Math.min(255, Math.max(0, v));
        }
      }
    }
    ctx.putImageData(imgData, 0, 0);
    return canvas;
  }

  function closeEditor(){ if (ed.parentNode) document.body.removeChild(ed); }

  ed.querySelector('#edRetake').onclick = closeEditor;

  ed.querySelector('#edAdd').onclick = ()=>{
    let finalCanvas;
    if (cropRect){
      finalCanvas = document.createElement('canvas');
      finalCanvas.width = Math.round(cropRect.w); finalCanvas.height = Math.round(cropRect.h);
      finalCanvas.getContext('2d').drawImage(rotatedCanvas, cropRect.x, cropRect.y, cropRect.w, cropRect.h, 0, 0, finalCanvas.width, finalCanvas.height);
    } else {
      finalCanvas = document.createElement('canvas');
      finalCanvas.width = rotatedCanvas.width; finalCanvas.height = rotatedCanvas.height;
      finalCanvas.getContext('2d').drawImage(rotatedCanvas, 0, 0);
    }
    applyColorFilter(finalCanvas, colorMode);
    closeEditor();
    onDone(finalCanvas);
  };
}

/* ============ EXPORT: EXCEL / PDF / COMBINED ============ */
function regRows(kind, list){
  const numberLabel = kind==='inward' ? 'Inward Number' : 'Outward Number';
  if (kind==='inward'){
    return {
      headers: ['Date', numberLabel, 'From', 'Subject', 'Remarks', 'Status', 'Priority', 'Due Date', 'Entered By', 'Attachment'],
      rows: list.map(r=>[r.date, r.refNo, r.from, r.subject, r.remarks, r.status, r.priority||'', r.dueDate||'', r.enteredBy, r.attachment?r.attachment.name:''])
    };
  }
  return {
    headers: ['Date', numberLabel, 'To', 'Subject', 'Remarks', 'Linked Inward No.', 'Entered By', 'Attachment'],
    rows: list.map(r=>[r.date, r.refNo, r.to, r.subject, r.remarks, r.linkedInwardId||'', r.enteredBy, r.attachment?r.attachment.name:''])
  };
}
function exportToExcel(kind, list){
  if (!list.length){ alert('No entries to export.'); return; }
  const {headers, rows} = regRows(kind, list);
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, kind==='inward'?'Inward':'Outward');
  XLSX.writeFile(wb, `${kind}-register-${new Date().toISOString().slice(0,10)}.xlsx`);
}
function exportInwardWithOutward(inwardList, outwardList){
  if (!inwardList.length){ alert('No inward entries to export.'); return; }
  const inHeaders = ['Date','Inward Number','From','Subject','Remarks','Status','Linked Outward Number(s)','Linked Outward Date(s)','Linked Outward Subject(s)'];
  const inRows = inwardList.map(r=>{
    const linked = outwardList.filter(o=>o.linkedInwardId===r.id);
    return [r.date, r.refNo, r.from, r.subject, r.remarks, r.status, linked.map(o=>o.refNo).join('; '), linked.map(o=>o.date).join('; '), linked.map(o=>o.subject).join('; ')];
  });
  const outHeaders = ['Date','Outward Number','To','Subject','Remarks','Linked Inward Number'];
  const outRows = outwardList.map(o=>{
    const linkedIn = inwardList.filter(i=>i.id===o.linkedInwardId)[0];
    return [o.date, o.refNo, o.to, o.subject, o.remarks, linkedIn ? linkedIn.refNo : ''];
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([inHeaders, ...inRows]), 'Inward');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([outHeaders, ...outRows]), 'Outward');
  XLSX.writeFile(wb, `inward-with-linked-outward-${new Date().toISOString().slice(0,10)}.xlsx`);
}
function exportToPdf(kind, list){
  if (!list.length){ alert('No entries to export.'); return; }
  const {headers, rows} = regRows(kind, list);
  const title = (kind==='inward'?'Inward':'Outward') + ' Register Abstract';
  const tableHtml = `<table border="1" cellspacing="0" cellpadding="5" style="border-collapse:collapse;width:100%;font-family:sans-serif;font-size:11px;">
    <thead><tr>${headers.map(h=>`<th style="background:#14456b;color:#fff;text-align:left;">${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
  </table>`;
  const win = window.open('', '_blank');
  win.document.write(`<html><head><title>${title}</title></head><body>
    <h2 style="font-family:sans-serif;">${title}</h2>
    <p style="font-family:sans-serif;font-size:12px;color:#555;">Generated ${new Date().toLocaleString()}</p>
    ${tableHtml}
    <script>window.onload=()=>window.print();<\/script>
  </body></html>`);
  win.document.close();
}

          <div style="display:flex;gap:6px;margin-top:6px;">
            <a href="${f.url}" target="_blank" class="btn-o btn-sm">View</a>
            ${(isAdmin||perms.storage_modify) ? `<button class="btn-o btn-sm" data-act="rename">Rename</button>`:''}
            ${(isAdmin||perms.storage_delete) ? `<button class="btn-d btn-sm" data-act="delete">Delete</button>`:''}
          </div></div>`);
        const renameBtn = row.querySelector('[data-act=rename]');
        if (renameBtn) renameBtn.onclick = async ()=>{
          const nn = prompt('New file name', f.name);
          if (nn && nn.trim()){ await api('rename_file', {fileId:f.id, newName:nn.trim()}); refresh(w.querySelector('#s_search').value); }
        };
        const deleteBtn = row.querySelector('[data-act=delete]');
        if (deleteBtn) deleteBtn.onclick = async ()=>{
          if (!confirm(`Delete "${f.name}"? This moves it to Drive trash.`)) return;
          try{ await api('delete_file', {fileId:f.id}); refresh(w.querySelector('#s_search').value); }
          catch(e){ alert(e.message); }
        };
        listBox.appendChild(row);
      });
    }catch(e){ listBox.innerHTML = `<div class="banner err">${esc(e.message)}</div>`; }
  }
  w.querySelector('#s_file').onchange = async (e)=>{
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      await api('upload_file', {fileName:file.name, mimeType:file.type, base64Data:reader.result.split(',')[1], folderId: w.querySelector('#s_folder').value});
      refresh(w.querySelector('#s_search').value);
    };
    reader.readAsDataURL(file);
  };
  let searchTimer;
  w.querySelector('#s_search').oninput = (e)=>{
    clearTimeout(searchTimer);
    searchTimer = setTimeout(()=>refresh(e.target.value), 300);
  };
  refresh('');
  return w;
}

/* ============ SCREENS: abstract (tabular, with file view) ============ */
async function screenAbstract(){
  const w = document.createElement('div');
  const perms = APP.user.permissions||{}; const isAdmin = APP.user.role==='admin';
  const canInward = isAdmin || perms.inward_view;
  const canOutward = isAdmin || perms.outward_view;

  if (canInward){
    const card = el(`<div class="card"><h2>Inward abstract</h2><div style="overflow-x:auto;"><table id="inTable">
      <thead><tr><th>Date</th><th>Inward No.</th><th>From</th><th>Subject</th><th>Status</th><th>File</th></tr></thead>
      <tbody></tbody></table></div></div>`);
    try{
      const {inward} = await api('list_inward');
      const tbody = card.querySelector('tbody');
      if (!inward.length) tbody.appendChild(el(`<tr><td colspan="6" class="empty">No entries.</td></tr>`));
      inward.forEach(r=>tbody.appendChild(el(`<tr><td>${r.date||''}</td><td>${esc(r.refNo)}</td><td>${esc(r.from)}</td><td>${esc(r.subject)}</td><td>${esc(r.status)}</td>
        <td>${r.attachment? `<a href="${r.attachment.url}" target="_blank">View</a>`:'—'}</td></tr>`)));
    }catch(e){ card.appendChild(el(`<div class="banner err">${esc(e.message)}</div>`)); }
    w.appendChild(card);
  }
  if (canOutward){
    const card = el(`<div class="card"><h2>Outward abstract</h2><div style="overflow-x:auto;"><table id="outTable">
      <thead><tr><th>Date</th><th>Outward No.</th><th>To</th><th>Subject</th><th>Linked Inward</th><th>File</th></tr></thead>
      <tbody></tbody></table></div></div>`);
    try{
      const {outward} = await api('list_outward');
      const tbody = card.querySelector('tbody');
      if (!outward.length) tbody.appendChild(el(`<tr><td colspan="6" class="empty">No entries.</td></tr>`));
      outward.forEach(r=>tbody.appendChild(el(`<tr><td>${r.date||''}</td><td>${esc(r.refNo)}</td><td>${esc(r.to)}</td><td>${esc(r.subject)}</td><td>${esc(r.linkedInwardId||'—')}</td>
        <td>${r.attachment? `<a href="${r.attachment.url}" target="_blank">View</a>`:'—'}</td></tr>`)));
    }catch(e){ card.appendChild(el(`<div class="banner err">${esc(e.message)}</div>`)); }
    w.appendChild(card);
  }
  return w;
}

/* ============ SCREENS: audit ============ */
async function screenAudit(){
  const w = el(`<div class="card"><h2>Audit log</h2></div>`);
  try{
    const {audit} = await api('audit_log');
    if (!audit.length) w.appendChild(el(`<div class="empty">No activity yet.</div>`));
    audit.slice(0,150).forEach(a=>w.appendChild(el(`<div class="row"><div><b>${esc(a.action)}</b><div class="meta">${esc(a.actor)} · ${new Date(a.time).toLocaleString()}</div><div class="meta">${esc(a.description)} ${a.refNo?('· '+esc(a.refNo)):''}</div></div></div>`)));
  }catch(e){ w.appendChild(el(`<div class="banner err">${esc(e.message)}</div>`)); }
  return w;
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

render();
</script>
